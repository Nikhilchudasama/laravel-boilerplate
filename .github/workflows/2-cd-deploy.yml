name: "CD — Deploy to Production"

# ──────────────────────────────────────────────────────────────────────────────
# Triggers ONLY on a push to main (i.e. after a PR is merged).
# All tests are re-verified on the exact merge commit before deploy.
# If ANY step fails → deploy is aborted, site stays on previous version.
# ──────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main

# Never run two production deploys at the same time — queue instead of cancel
concurrency:
  group: cd-production
  cancel-in-progress: false

env:
  PHP_VERSION: "8.3"
  NODE_VERSION: "20"

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # JOB 1 — Verify: re-run every test on the merged commit
  # Ensures what lands on production is exactly what CI approved.
  # ────────────────────────────────────────────────────────────────────────────
  verify:
    name: "🔍 Verify merged code"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── PHP ────────────────────────────────────────────────────────────────
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
          coverage: none
          tools: composer:v2

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-scripts --no-progress

      # ── Node ───────────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      # ── PHP checks ─────────────────────────────────────────────────────────
      - name: PHP Lint (Pint)
        run: ./vendor/bin/pint --parallel --test

      - name: PHP Static Analysis (PHPStan)
        run: ./vendor/bin/phpstan analyse --memory-limit=2G --no-progress

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate application key
        run: |
          php artisan key:generate --force
          echo "APP_KEY=$(grep '^APP_KEY=' .env | cut -d '=' -f2-)" >> $GITHUB_ENV

      - name: PHP Tests (Pest)
        run: ./vendor/bin/pest --parallel
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"

      # ── JS/TS checks ───────────────────────────────────────────────────────
      - name: ESLint
        run: npm run test:lint

      - name: TypeScript type check
        run: npm run test:types

      - name: Vitest unit tests
        run: npm run test -- --reporter=verbose

      # ── Build production assets ────────────────────────────────────────────
      - name: Build production assets (Vite)
        run: npm run build

      - name: Upload built assets
        uses: actions/upload-artifact@v4
        with:
          name: built-assets-${{ github.sha }}
          path: public/build/
          retention-days: 3

  # ────────────────────────────────────────────────────────────────────────────
  # JOB 2 — Deploy to Production
  # Only runs after verify passes. Uses SSH to pull code and run artisan.
  #
  # Required GitHub Secrets (Settings → Secrets → Actions):
  #   SSH_PRIVATE_KEY  – contents of ~/.ssh/git_contabo
  #   SSH_HOST         – production server IP or hostname
  #   SSH_USER         – SSH username on the server
  #   DEPLOY_PATH      – absolute path to project on server (e.g. /var/www/html)
  #   PRODUCTION_URL   – public URL (e.g. https://yourdomain.com) ← store as a VARIABLE, not a Secret
  #                       (Settings → Secrets and variables → Actions → Variables tab)
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: "🚀 Deploy → Production"
    runs-on: ubuntu-latest
    needs: [verify]           # ← aborted if verify fails
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}   # Store in Variables (not Secrets) — see comment below

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download built assets
        uses: actions/download-artifact@v4
        with:
          name: built-assets-${{ github.sha }}
          path: public/build/

      # ── Setup SSH ──────────────────────────────────────────────────────────
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      # ── Enable maintenance mode ────────────────────────────────────────────
      - name: Enable maintenance mode
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && php artisan down --retry=60 --secret=bypass-maintenance"
        continue-on-error: true   # don't abort if already in maintenance

      # ── Deploy ─────────────────────────────────────────────────────────────
      - name: Pull latest code & run artisan
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'ENDSSH'
            set -e

            cd ${{ secrets.DEPLOY_PATH }}

            echo "⏳ Pulling latest code from main..."
            git pull origin main

            echo "⏳ Installing Composer dependencies (production, no-dev)..."
            composer install \
              --no-dev \
              --optimize-autoloader \
              --no-interaction \
              --no-progress \
              --prefer-dist

            echo "⏳ Running database migrations..."
            php artisan migrate --force

            echo "⏳ Caching config, routes and views..."
            php artisan optimize

            echo "⏳ Restarting queue workers..."
            php artisan queue:restart

            echo "✅ Code deploy complete."
          ENDSSH

      - name: Sync built Vite assets to server
        run: |
          rsync -avz --delete public/build/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.DEPLOY_PATH }}/public/build/

      # ── Disable maintenance mode ───────────────────────────────────────────
      # Runs with `if: always()` so the site comes back up even if a step failed
      - name: Disable maintenance mode
        if: always()
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && php artisan up" || true

      # ── Summary ────────────────────────────────────────────────────────────
      - name: Print deploy summary
        if: success()
        run: |
          echo "✅ Production deploy succeeded!"
          echo "   Commit : ${{ github.sha }}"
          echo "   By     : ${{ github.actor }}"
          echo "   URL    : ${{ vars.PRODUCTION_URL }}"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Production deploy FAILED!"
          echo "   Commit : ${{ github.sha }}"
          echo "   Run    : ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "   Site is still UP on the previous version."
          # ↑ Add Slack / Discord / email webhook here if needed
